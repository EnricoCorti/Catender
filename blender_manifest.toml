# Catender — Blender Extension Manifest
schema_version = "1.0.0"

id = "catia_gsd"
version = "0.1.0"
name = "Catender"
tagline = "CATIA Generative Shape Design for Blender — NURBS surface modeling"
maintainer = "EnricoCorti"
type = "add-on"

website = "https://github.com/EnricoCorti/Catender"

tags = ["Modeling", "Geometry Nodes", "Add Curve", "Add Mesh", "3D View"]

blender_version_min = "5.1.0"

license = ["SPDX:MIT"]

copyright = ["2026 EnricoCorti"]

platforms = ["windows-x64"]

[permissions]
files = "Import and export CAD files"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.vscode/",
    "/*.zip",
    "*.blend1",
    ".gitignore",
    "README.md",
]
